[project]
name = "mastodon-finder"
version = "0.2.0"
keywords = ["mastodon"]
description = "Search for mastodon profiles, use mechanical and LLM filtering."
readme = "README.md"
authors = [
    { name = "Matthew Dean Martin", email = "matthewdeanmartin@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Pydantic",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    # "Programming Language :: Python :: 3.15",
    "Topic :: Utilities",
    "Environment :: Console",
    "Topic :: Internet",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Communications :: Chat",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "License :: OSI Approved :: MIT License"
]


dependencies = [
    "mastodon-py>=2.1.4",
    "python-dotenv",
    "beautifulsoup4",
    "openai",
    "langdetect",
    "rich",
    "tomli",
    "pydantic-settings",
    "colorlog", # could be optional
]

[dependency-groups]
dev = [
    "jiggle-version>=2.1.0",
    "dont-be-lazy>=0.1.2",
    "pydoc-fork>=3.0.0",

    "pip-licenses",
    #    "toml-formatter",
    "bitrab",
    "types-PyYAML",
    "troml",
    "cli-tool-audit",
    "git2md",
    "pyclean; python_version >= '3.12'",
    "strip-docs>=1.0; python_version >= '3.12'",
    "gha-update; python_version >= '3.12'",
    "mkdocstrings[python]",
    "mkdocs<2; python_version >= '3.12'",
    "mdformat",
    # plugin finder
    "packaging",
    # mpy
    "types-retry",
    "types-Markdown",
    "mypy",
    "types-toml",
    # reports

    # build
    "vermin",
    "metametameta>=0.1.3",
    "hatchling",
    "ruff>=0.12.0",
    "pylint",
    "bandit",
    "bandit>=1.8.6; python_version >= '3.14'",
    "pre-commit",
    # testing tools
    "pytest",
    "pytest-cov",
    "pytest-xdist>=3.5.0",
    "pytest-randomly>=3.15.0",
    "pytest-sugar>=0.9.7",
    "pytest-mock",
    # "pytest-unused-whichfixtures",
    "hypothesis[cli]",
    "detect-test-pollution",
    "pytest-timeout>=2.4.0",
    # Mock Mastodon server (published on PyPI) — lets test_integration/ run the
    # finder's real Mastodon.py client against a local HTTP server instead of a
    # live instance. The [test] extra adds the zero-boilerplate fixtures /
    # MockServer helper. Requires Python >=3.13; the integration suite self-skips
    # otherwise.
    "mastodon_mock[test]; python_version >= '3.13'",
    # docs
    "interrogate>=1.5.0",
    "pydoctest==0.2.1",
    "pdoc3>=0.5.0",
    "mdformat>=0.5.0",
    "linkcheckmd>=1.4.0",
    "codespell>=2.2.6",
    "pyenchant>=3.2.2",
    "troml-dev-status>=0.6.0",
    # extras
    "rich",
    "pandas",
    "requests",
    "beautifulsoup4",
    "stravalib",
    "pyarrow",
    "fastparquet",
    "openpyxl",
    "keepachangelog-manager-fork[fast]>=6.8.0; python_version < '3.15'",
    "keepachangelog-manager-fork[stdlib]>=6.8.0; python_version >= '3.15'",
]

[project.urls]
Repository = "https://github.com/matthewdeanmartin/mastodon-finder"
Documentation = "https://mastodon-finder.readthedocs.io/en/latest/"
Changelog = "https://github.com/matthewdeanmartin/mastodon-finder/blob/main/CHANGELOG.md"

homepage = "https://github.com/matthewdeanmartin/mastodon-finder"
issues = "https://github.com/matthewdeanmartin/mastodon-finder/issues/"


[project.scripts]
mastodon-finder = "mastodon_finder:finder.main"
mastodon_finder = "mastodon_finder:finder.main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "src/mastodon_finder/**/*.py",
    "src/mastodon_finder/py.typed",
    "/README.md", "LICENSE",
]

exclude = [

]


[tool.hatch.build.targets.wheel]
packages = ["src/mastodon_finder"]
include = [
    "src/mastodon_finder/**/*.py",
    "src/mastodon_finder/py.typed",
    "/README.md", "LICENSE",
]


[mypy]
plugins = "pydantic.mypy"

[tool.mastodon-finder]
mode = "application"  # or "library"
use_ai = true

# changelogmanager (keepachangelog-manager-fork) drives the release workflows.
# See .github/workflows/create_draft_release.yml and release.yml.
[tool.changelogmanager.versioning]
scheme = "semver"

[tool.changelogmanager.validation]
enforce_preamble = true
format = "auto"

[tool.changelogmanager.defaults]
skip_ci = true
error_format = "github"
commit_schema = "keepachangelog"
schema_version = "current"

[[tool.changelogmanager.components]]
name = "default"
changelog = "CHANGELOG.md"

[tool.uv]

[tool.uv.pip]
universal = true

[tool.ruff.lint]
ignore = ["RUF100", "BLE001", "ISC004", "PIE810", "SIM102"]  # unused noqa differs across Python versions
